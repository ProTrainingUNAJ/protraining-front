name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # "tsc && vite build": falla si hay errores de tipos de TypeScript.
      - name: Build
        run: npm run build
